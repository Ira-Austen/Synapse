name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode optional release keystore
        if: ${{ secrets.SYNAPSE_KEYSTORE_BASE64 != '' }}
        env:
          SYNAPSE_KEYSTORE_BASE64: ${{ secrets.SYNAPSE_KEYSTORE_BASE64 }}
        run: |
          echo "$SYNAPSE_KEYSTORE_BASE64" | base64 -d > release.keystore
          echo "SYNAPSE_KEYSTORE_PATH=$GITHUB_WORKSPACE/release.keystore" >> $GITHUB_ENV

      - name: Run all unit tests
        run: ./gradlew :core-protocol:test :agent-runtime:test :kernel-engine:testDebugUnitTest :app:testModernDebugUnitTest

      - name: Build Modern Release & Debug APKs
        env:
          SYNAPSE_KEYSTORE_PASS: ${{ secrets.SYNAPSE_KEYSTORE_PASS }}
          SYNAPSE_KEY_ALIAS: ${{ secrets.SYNAPSE_KEY_ALIAS }}
          SYNAPSE_KEY_PASS: ${{ secrets.SYNAPSE_KEY_PASS }}
        run: ./gradlew :app:assembleModernRelease :app:assembleModernDebug

      - name: Prepare release artifacts
        run: |
          mkdir -p dist
          VERSION_TAG="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            VERSION_TAG="dev-${GITHUB_SHA::7}"
          fi
          cp app/build/outputs/apk/modern/release/app-modern-release.apk "dist/Synapse-${VERSION_TAG}-modern-release.apk"
          cp app/build/outputs/apk/modern/debug/app-modern-debug.apk "dist/Synapse-${VERSION_TAG}-modern-debug.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -lh dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: synapse-apks
          path: dist/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Synapse ${{ github.ref_name }}"
          generate_release_notes: true
          body: |
            ## Synapse ${{ github.ref_name }}

            ### 安装说明
            - 推荐下载 **`Synapse-${{ github.ref_name }}-modern-release.apk`**（支持 **LSPosed v2.0+ / Vector** Modern `libxposed` API 101/102）。
            - 安装后在 LSPosed / Vector 中启用模块（作用域勾选 **系统框架 `system`**）并重启设备即可生效。
            - 已在 **Android 16 + ColorOS 16** 真机实测 5/5 全插件激活（含 ColorOS 16 Hans 墓碑防冻）及 **Android 15** 实测验证。

            ### 校验和
            请核对附件中的 `SHA256SUMS.txt`。
          files: |
            dist/Synapse-*-modern-release.apk
            dist/Synapse-*-modern-debug.apk
            dist/SHA256SUMS.txt
